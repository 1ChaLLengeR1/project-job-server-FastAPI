---
- name: Zaloguj do Docker Huba
  ansible.builtin.command:
    cmd: docker login -u {{ docker_hub_username }} --password-stdin
    stdin: "{{ docker_hub_password }}"
  no_log: true
  changed_when: false

- name: Deploy stacka Traefik
  ansible.builtin.command:
    cmd: docker stack deploy -c infra/dockerfiles/compose/traefik.yml traefik
    chdir: "{{ deploy_dir }}"
  changed_when: true

- name: Deploy stacka aplikacji
  ansible.builtin.command:
    cmd: >-
      docker stack deploy --with-registry-auth
      -c infra/dockerfiles/compose/prod.swarm.docker-compose.yaml
      {{ stack_name }}
    chdir: "{{ deploy_dir }}"
  environment:
    PROJECT_JOB_ENV_SECRET_VERSION: "{{ env_secret_version }}"
    BACKEND_IMAGE: "{{ backend_image }}"
  changed_when: true
