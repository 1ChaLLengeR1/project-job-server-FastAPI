---
- name: Pobierz bundle env z Dopplera
  ansible.builtin.command:
    cmd: >-
      doppler secrets download
      --token {{ doppler_token }}
      --project {{ doppler_project }}
      --config {{ doppler_config }}
      --no-file --format env
  register: doppler_env
  no_log: true
  changed_when: false

- name: Policz wersję sekretu (hash sha256 zawartości)
  ansible.builtin.set_fact:
    env_secret_version: "{{ (doppler_env.stdout | hash('sha256'))[:12] }}"
    env_secret_name: "{{ env_secret_prefix }}{{ (doppler_env.stdout | hash('sha256'))[:12] }}"
  no_log: true

- name: Sprawdź, czy docker secret już istnieje
  ansible.builtin.command:
    cmd: docker secret inspect {{ env_secret_name }}
  register: secret_inspect
  failed_when: false
  changed_when: false

- name: Utwórz content-hashed docker secret
  ansible.builtin.command:
    cmd: docker secret create {{ env_secret_name }} -
    stdin: "{{ doppler_env.stdout }}"
  when: secret_inspect.rc != 0
  no_log: true

- name: Zbierz stare wersje sekretu
  ansible.builtin.shell:
    cmd: docker secret ls --format '{{ '{{' }}.Name{{ '}}' }}' | grep '^{{ env_secret_prefix }}' | grep -v '^{{ env_secret_name }}$' || true
  register: old_secrets
  changed_when: false

- name: Usuń stare wersje sekretu (ignoruj będące w użyciu)
  ansible.builtin.command:
    cmd: docker secret rm {{ item }}
  loop: "{{ old_secrets.stdout_lines }}"
  failed_when: false
