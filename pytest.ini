[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto

; ciezkie markery domyslnie WYKLUCZONE (jak w ARCHITEKTURA.md sekcja 10.2)
addopts = -m "not slow and not integration and not full_integration and not api_integration"

markers =
    slow: testy stress/wyczerpujace
    integration: testy z realna baza danych
    full_integration: pelna integracja z zewnetrznymi systemami
    api_integration: strzaly do zewnetrznych API (np. date.nager.at)
