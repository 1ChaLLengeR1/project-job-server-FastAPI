name: CI - Tests (runner)

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      # Dummy env - wystarczają do importu aplikacji i lint;
      # przy dodaniu testów integracyjnych podpiąć services: postgres.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci
      DB_PASSWORD: ci
      DB_DBNAME: ci
      SECRET_KEY_TOKEN: ci
      SECRET_KEY_REFRESH_TOKEN: ci
      ALGORITHM: HS256
      TOKEN_EXPIRES_HOURS: "1"
      REFRESH_TOKEN_EXPIRES_HOURS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python + dependencies
        run: |
          uv python install 3.10
          uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Import smoke (main + routery + modele)
        run: uv run python -c "import main; print('import ok')"

      # TODO: po dodaniu testów pytest:
      # - name: Run tests
      #   run: make run_test_integration
